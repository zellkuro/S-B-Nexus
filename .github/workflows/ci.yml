name: Tests and backend deploy

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the world's rules.js matches shared/rules.js (if a copy is committed)
        run: |
          if [ -f world/WebRoot/rules.js ]; then cmp shared/rules.js world/WebRoot/rules.js; fi
      - run: npm test

  # Deploys the backend from main. Needs two repository secrets:
  #   CLOUDFLARE_API_TOKEN  (a token with "Edit Cloudflare Workers" + D1 edit)
  #   CLOUDFLARE_ACCOUNT_ID
  # Without them this job is skipped. See backend/README.md.
  deploy-backend:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
      - name: Install
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci
      - name: Create the players table if it's missing
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler d1 execute sbn --remote --file=schema.sql
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
